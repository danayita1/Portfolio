<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Tracker</title>

  <!-- Leaflet map library (free) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    h1 { margin: 0; padding: 12px; background: #1a7f4b; color: white; font-size: 20px; }
    #map { height: calc(100vh - 48px); }
  </style>
</head>
<body>
  <h1>Bus Tracker - Addis Ababa</h1>
  <div id="map"></div>

     <script>
    // Create the map, centered between Meskel Square and Bole
    var map = L.map('map').setView([9.0000, 38.7800], 14);

    // Load the map pictures (tiles) from OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Add the bus dot (it starts in the middle of the map)
    var bus = L.circleMarker([9.0000, 38.7800], {
      radius: 10,
      color: '#c0392b',
      fillColor: '#e74c3c',
      fillOpacity: 0.9
    }).addTo(map);

    bus.bindPopup('Bus 1');

    // Ask the server for the latest bus location and move the dot there
    function updateBus() {
      fetch('http://127.0.0.1:5000/location')
        .then(function (response) { return response.json(); })
        .then(function (data) {
          bus.setLatLng([data.lat, data.lng]);
        })
        .catch(function (error) {
          console.log('Could not reach the server:', error);
        });
    }

    // Do it once now, then again every 2 seconds
    updateBus();
    setInterval(updateBus, 2000);
  </script>
</body>
</html>
