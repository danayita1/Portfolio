<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Mode</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 24px; }
    input, select { font-size: 20px; padding: 10px; border: 1px solid #999; border-radius: 8px; width: 280px; text-align: center; margin-bottom: 12px; }
    button { font-size: 20px; padding: 14px 28px; border: none; border-radius: 8px; color: white; background: #1a7f4b; margin-top: 8px; }
    button.stop { background: #c0392b; }
    #status { margin-top: 24px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Driver Mode</h1>
  <input id="busId" type="text" placeholder="Bus ID, e.g. Bus 1">
  <br>
  <input id="code" type="password" placeholder="Access code">
  <br>
  <select id="route"></select>
  <br>
  <button id="toggle">Start sharing location</button>
  <p id="status">Not sharing.</p>

  <script>
    var watchId = null;
    var button = document.getElementById('toggle');
    var statusEl = document.getElementById('status');
    var busInput = document.getElementById('busId');
    var codeInput = document.getElementById('code');
    var routeSelect = document.getElementById('route');


    // Ask the phone to keep the screen on while sharing, so GPS doesn't pause
    var wakeLock = null;

    async function keepScreenOn() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {
        // Not supported or denied. Sharing still works without it.
      }
    }

    function releaseScreen() {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    // The screen lock is dropped when the page is hidden. Take it again when the driver returns.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && watchId !== null) {
        keepScreenOn();
      }
    });
    // Fill the route dropdown from the server
    fetch('/routes')
      .then(function (r) { return r.json(); })
      .then(function (routes) {
        Object.keys(routes).forEach(function (id) {
          var option = document.createElement('option');
          option.value = id;
          option.textContent = routes[id].name;
          routeSelect.appendChild(option);
        });
      })
      .catch(function () {
        statusEl.textContent = 'Could not load routes.';
      });

    function stopSharing(message) {
        releaseScreen();
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      busInput.disabled = false;
      codeInput.disabled = false;
      routeSelect.disabled = false;
      button.textContent = 'Start sharing location';
      button.className = '';
      statusEl.textContent = message;
    }

    function sendLocation(position) {
      var lat = position.coords.latitude;
      var lng = position.coords.longitude;

      fetch('/location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bus_id: busInput.value,
          code: codeInput.value,
          route_id: routeSelect.value,
          lat: lat,
          lng: lng
        })
      })
        .then(function (response) {
          if (response.status === 403) {
            stopSharing('Wrong bus ID or access code.');
            return;
          }
          if (!response.ok) {
            statusEl.textContent = 'The server rejected the location.';
            return;
          }
          statusEl.textContent = busInput.value + ' sharing. Last sent: ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
        })
        .catch(function () {
          statusEl.textContent = 'Could not reach the server.';
        });
    }

    function locationError(error) {
      statusEl.textContent = 'Location error: ' + error.message;
    }

    button.addEventListener('click', function () {
      if (watchId === null) {
        if (busInput.value.trim() === '') {
          statusEl.textContent = 'Please type a Bus ID first.';
          return;
        }
        if (codeInput.value === '') {
          statusEl.textContent = 'Please type your access code.';
          return;
        }
        if (!navigator.geolocation) {
          statusEl.textContent = 'This device does not support location.';
          return;
        }
        statusEl.textContent = 'Waiting for GPS...';
        watchId = navigator.geolocation.watchPosition(sendLocation, locationError, {
          enableHighAccuracy: true
        });
        keepScreenOn();
        busInput.disabled = true;        codeInput.disabled = true;
        routeSelect.disabled = true;
        button.textContent = 'Stop sharing';
        button.className = 'stop';
      } else {
        stopSharing('Not sharing.');
      }
    });
  </script>
</body>
</html>
